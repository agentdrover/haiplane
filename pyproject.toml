[project]
name = "haiplane-hub"
version = "0.1.0"
description = "Web dashboard + MCP server for Haiplane agent development"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "aiosqlite>=0.21",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "mcp[cli]>=1.9",
    "pyyaml>=6.0.3",
    "argon2-cffi>=25.1.0",
    "cryptography>=48.0.1",
    "starlette>=1.3.1",
]

[project.scripts]
haiplane-hub = "hub.app:main"
hp-hub = "hub.cli:main"
haiplane-hub-mcp = "hub.mcp_server:main"
hp-git-policy = "hub.git_policy:main"

[tool.hatch.build.targets.wheel]
packages = ["hub"]
# work_type YAML templates ship as package data (read via importlib.resources);
# so do the workflow templates provisioning lays into a project repo (#476).
artifacts = [
    "hub/cli_templates/work_types/*.yaml",
    "hub/workflow_templates/*.yml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15.10",
]

[tool.mypy]
python_version = "3.11"
files = ["hub"]
# Строгость подобрана снизу вверх (#847): дефолтный набор проверок плюс
# pydantic-плагин, без --strict. Цель первой задачи — рабочий гейт на ядре,
# а не максимальная придирчивость: правило, которое нельзя удержать зелёным,
# отключают целиком, и проверки не остаётся вовсе.
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff.lint.mccabe]
# Бюджет сложности (#1066, эпик #1064). Пороги живут здесь, чтобы у числа было
# одно место: scripts/complexity_budget.py читает конфиг отсюда, а не носит
# свою копию. Сами правила НЕ включены в lint.select намеренно — на develop у
# них 24 и 12 нарушений соответственно, а выразить пофункциональное исключение
# в конфиге ruff нельзя: per-file-ignores гасит файл целиком, что запрещено
# постановкой (исключение на файл прячет и все будущие нарушения в нём), а
# `# noqa` — это правка hub/, которую задача не делает. Поэтому правила
# селектит проверка бюджета, а ledger исключений лежит в
# docs/agent-context/complexity-budget.json.
max-complexity = 15

[tool.ruff.lint.pylint]
# Длина функции меряется операторами, а не строками: строки считают и
# докстроку, а она в этом репозитории несёт разбор решения и штрафовать её
# нечем. 60 операторов — хвост распределения: под порогом 12 функций из 1714.
max-statements = 60
