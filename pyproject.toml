[project]
name = "haiplane-hub"
version = "0.1.0"
description = "Web dashboard + MCP server for Haiplane agent development"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "aiosqlite>=0.21",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "mcp[cli]>=1.30,<3",
    "pyyaml>=6.0.3",
    "argon2-cffi>=25.1.0",
    "cryptography>=48.0.1",
    "starlette>=1.3.1",
    # pyjwt comes in through mcp (>=2.10.1). Prod installs with `pip install -e`
    # and no uv.lock, so an already installed 2.13.0 would stay: this floor is
    # what upgrades it past the 2026 JWK/HS256/OKP advisories (#1619).
    "pyjwt[crypto]>=2.15.0",
    "tzdata>=2026.5",
]

[project.scripts]
haiplane-hub = "hub.app:main"
hp-hub = "hub.cli:main"
haiplane-hub-mcp = "hub.mcp_server:main"
hp-git-policy = "hub.git_policy:main"

[tool.hatch.build.targets.wheel]
packages = ["hub"]
# work_type YAML templates ship as package data (read via importlib.resources);
# so do the workflow templates provisioning lays into a project repo (#476).
artifacts = [
    "hub/cli_templates/work_types/*.yaml",
    "hub/workflow_templates/*.yml",
]

# Навыки хаба (#1701): текст живёт в skills/ в корне репозитория, в wheel
# он ложится в hub/_skills, откуда его читает hub.skill_files.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "hub/_skills"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# #1996: the browser scenarios of tests/gui need Chromium, so they are not part
# of any default run. `--ignore` skips the directory when it is reached by
# walking `tests/` and leaves it collectable by an explicit path, which is how
# `make gui-test` names it. Not `-p`/`-n` here: addopts also reach the AC reporter
# (scripts/ci_report_to_hub.py), and an ignore of one directory does not change
# the node ids it reads.
addopts = "--ignore=tests/gui"
# #1666: a hung test must fail by name in minutes, not hold CI for hours.
# "signal" (SIGALRM) interrupts the test with a stack and lets the run go on;
# the suite's own tests use no SIGALRM and xdist runs tests in the main thread.
timeout = 300
timeout_method = "signal"

[dependency-groups]
build = [
    "editables>=0.6",
    "hatchling>=1.32.4",
]
dev = [
    "bandit>=1.9.4",
    "cosmic-ray>=8.7,<9",
    "detect-secrets>=1.5.0",
    "hatchling>=1.32.4",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "playwright>=1.64.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16.8",
]

[tool.mypy]
python_version = "3.11"
files = ["hub"]
# Строгость подобрана снизу вверх (#847): дефолтный набор проверок плюс
# pydantic-плагин, без --strict. Цель первой задачи — рабочий гейт на ядре,
# а не максимальная придирчивость: правило, которое нельзя удержать зелёным,
# отключают целиком, и проверки не остаётся вовсе.
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff.lint]
# Набор правил задан явно (#1838): ruff 0.16 расширил набор по умолчанию, на
# 18.10 это 1327 замечаний. Здесь ровно прежний набор 0.15.10 (E4, E7, E9, F);
# новые правила включаются отдельной задачей, а не сменой версии ruff.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.mccabe]
# Бюджет сложности (#1066, эпик #1064). Пороги живут здесь, чтобы у числа было
# одно место: scripts/complexity_budget.py читает конфиг отсюда, а не носит
# свою копию. Сами правила НЕ включены в lint.select намеренно — на develop у
# них 24 и 12 нарушений соответственно, а выразить пофункциональное исключение
# в конфиге ruff нельзя: per-file-ignores гасит файл целиком, что запрещено
# постановкой (исключение на файл прячет и все будущие нарушения в нём), а
# `# noqa` — это правка hub/, которую задача не делает. Поэтому правила
# селектит проверка бюджета, а ledger исключений лежит в
# docs/agent-context/complexity-budget.json.
max-complexity = 15

[tool.ruff.lint.pylint]
# Длина функции меряется операторами, а не строками: строки считают и
# докстроку, а она в этом репозитории несёт разбор решения и штрафовать её
# нечем. 60 операторов — хвост распределения: под порогом 12 функций из 1714.
max-statements = 60

[tool.haiplane.file_size]
# Бюджет размера файла (#1669): строк в одном .py по деревьям. Пороги живут
# здесь, scripts/file_size_budget.py копии не носит. Файлы выше порога внесены
# в docs/agent-context/file-size-budget.json с потолком (замер + 5%).
# tests = REVIEW_FILE_LINE_CAP (hub/services/review_dispatch.py): столько строк
# файла читает машинное ревью; равенство держит тест (#1932). Ledger tests
# только сокращается.
hub = 1500
scripts = 1500
tests = 800
# Доля порога (%), с которой файл вне ledger называется «у порога» (#1676).
# Это не дерево измерения.
near_pct = 90
