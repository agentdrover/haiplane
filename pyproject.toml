[project]
name = "openclaw-hub"
version = "0.1.0"
description = "Web dashboard + MCP server for managing OpenClaw agent development"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "aiosqlite>=0.21",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
    "mcp[cli]>=1.9",
    "pyyaml>=6.0.3",
    "argon2-cffi>=25.1.0",
    "cryptography>=48.0.1",
    "starlette>=1.3.1",
]

[project.scripts]
openclaw-hub = "hub.app:main"
oc-hub = "hub.cli:main"
openclaw-hub-mcp = "hub.mcp_server:main"
oc-git-policy = "hub.git_policy:main"

[tool.hatch.build.targets.wheel]
packages = ["hub"]
# work_type YAML templates ship as package data (read via importlib.resources);
# so do the workflow templates provisioning lays into a project repo (#476).
artifacts = [
    "hub/cli_templates/work_types/*.yaml",
    "hub/workflow_templates/*.yml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
]

[tool.mypy]
python_version = "3.11"
files = ["hub"]
# Строгость подобрана снизу вверх (#847): дефолтный набор проверок плюс
# pydantic-плагин, без --strict. Цель первой задачи — рабочий гейт на ядре,
# а не максимальная придирчивость: правило, которое нельзя удержать зелёным,
# отключают целиком, и проверки не остаётся вовсе.
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true

# Единственный список исключений — здесь, а не тегами type: ignore по коду:
# список видно, его можно посчитать, и он ТОЛЬКО СОКРАЩАЕТСЯ. Расширять его
# — отдельное решение, а не побочный эффект правки. Остаток: 37 ошибок в трёх
# самых толстых модулях проекта, они снимаются задачей #848.
[[tool.mypy.overrides]]
module = ["hub.mcp_server", "hub.app", "hub.web"]
ignore_errors = true
