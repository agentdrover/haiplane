<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in — OpenClaw Hub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1f980;</text></svg>">
    <link rel="stylesheet" href="/static/style.css?v={{ asset_version|default('20260419a') }}">
</head>
<body class="login-body">
<div class="login-card">
    <div class="login-logo">
        <span class="login-logo-main">OpenClaw</span>
        <span class="login-logo-sub">Hub</span>
    </div>
    <h1 class="login-title">Sign in</h1>
    <p class="login-hint">
        Paste the personal token issued by the Hub admin. Tokens are stored in the
        <code>OPENCLAW_HUB_TOKENS</code> environment variable on the server.
    </p>
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="login-form">
        <input type="hidden" name="next" value="{{ next or '/' }}">
        <label for="token">Token</label>
        <input type="password" id="token" name="token" autocomplete="current-password" autofocus required>
        <button type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
