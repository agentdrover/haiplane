<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - {{ product_title }}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='18,12 88,50 18,88' fill='%236c5ce7'/></svg>">
    <link rel="stylesheet" href="/static/style.css?v={{ asset_version|default('20260605b') }}">
</head>
<body class="login-body">
<main class="login-focus-page" aria-label="{{ product_title }} sign in">
    <section class="login-focus-wrap">
        <div class="login-card login-card--focus">
            <div class="login-logo">
                <span class="login-logo-main">{{ product_name }}</span>
                <span class="login-logo-sub">Hub</span>
            </div>
            <h1 class="login-title">Sign in</h1>
            <p class="login-hint">Access the hub dashboard.</p>
            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}
            <form method="post" action="/login" class="login-form">
                <input type="hidden" name="next" value="{{ next or '/' }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password">
                <button type="submit">Sign in</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
