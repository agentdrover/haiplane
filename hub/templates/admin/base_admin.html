{% extends "base.html" %}
{% block content %}
<div class="admin-layout">
    <nav class="admin-nav">
        <a href="/admin" class="{% if admin_page == 'summary' %}active{% endif %}">Summary</a>
        <a href="/admin/users" class="{% if admin_page == 'users' %}active{% endif %}">Users{% if nav_users %} <span class="nav-badge">{{ nav_users }}</span>{% endif %}</a>
        <a href="/admin/agents" class="{% if admin_page == 'agents' %}active{% endif %}">Agents{% if nav_agents %} <span class="nav-badge">{{ nav_agents }}</span>{% endif %}</a>
        <a href="/admin/roles" class="{% if admin_page == 'roles' %}active{% endif %}">Roles</a>
        <a href="/admin/keys" class="{% if admin_page == 'keys' %}active{% endif %}">API Keys{% if nav_keys %} <span class="nav-badge">{{ nav_keys }}</span>{% endif %}</a>
        <a href="/admin/audit" class="{% if admin_page == 'audit' %}active{% endif %}">Audit</a>
    </nav>
    <div class="admin-content">
        <div id="admin-flash" class="admin-flash-container"></div>
        {% block admin_content %}{% endblock %}
    </div>
</div>
<script>
document.body.addEventListener("showFlash", function(e) {
    var container = document.getElementById("admin-flash");
    if (!container || !e.detail) return;
    var msg = e.detail.message || "";
    var level = e.detail.level || "success";
    if (!msg) return;
    var el = document.createElement("div");
    el.className = "admin-flash admin-flash-" + level;
    el.textContent = msg;
    el.onclick = function() { el.remove(); };
    container.appendChild(el);
    setTimeout(function() {
        el.style.animation = "flashOut 0.3s ease both";
        setTimeout(function() { el.remove(); }, 300);
    }, 4000);
});
</script>
{% endblock %}
