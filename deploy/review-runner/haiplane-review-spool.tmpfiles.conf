# /etc/tmpfiles.d/haiplane-review-spool.conf — каталог очереди службы (#1571).
# Лежит в ReadWritePaths хаба; setgid 2770 и группа haiplane-review: хаб и
# служба пишут в него как участники группы, остальным хода нет.
# Подставьте каталог данных хаба (из ReadWritePaths его юнита) и пользователя юнита:
d <каталог данных хаба>/review-spool 2770 <пользователь хаба> haiplane-review -
