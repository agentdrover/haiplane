name: Report AC tests and validation to Haiplane Hub
description: >-
  Run a task's bound AC tests and validation commands as evidence about ONE
  commit. With hub-read-token (#1686) the results are written to results-dir
  for a trusted workflow to send; with only hub-token the action sends them
  itself (satellite repositories, until they move). Never fails the job, never
  reports a guess: silence is read by the hub as "unknown", never as success.

inputs:
  hub-url:
    description: Base URL of the hub (e.g. https://hub.example.com). Absent ⇒ report nothing and say so.
    required: false
    default: ""
  hub-token:
    description: >-
      Token of a ci_runner principal, used only when hub-read-token is absent
      (the satellite mode). It holds one permission (tasks.ci_report) and can
      neither move a task nor write a verdict — keep it that way. The hub's own
      workflow does NOT pass it: the code of a task branch runs in this job.
    required: false
    default: ""
  hub-read-token:
    description: >-
      Token of a ci_reader principal bound to the project (#1686): it can read
      the task card and nothing else. With it the action sends nothing to the
      hub; it writes the results to results-dir.
    required: false
    default: ""
  results-dir:
    description: >-
      Directory the results are written to in collect mode. The workflow uploads
      it as the artifact hub-ci-results-<run_attempt>.
    required: false
    default: "hub-ci-results"
  head-sha:
    description: >-
      The commit this run is evidence ABOUT — the BRANCH HEAD. On pull_request
      events GITHUB_SHA is a throwaway merge commit that exists in no branch and
      can never match the tip the hub pinned at submission, so the caller passes
      the head explicitly; see docs/satellite-ci-report.md for the exact
      expression. (It is spelled out there rather than here: the runner
      evaluates every expression in this manifest, including inside
      descriptions, and the github context does not exist at that point — an
      example written literally here fails the whole action at load time.)
    required: false
    default: ""
  ac-runner:
    description: >-
      How to run this repository's tests, e.g. "uv run pytest", "poetry run
      pytest", "pytest". Default is the hub repository's own runner.
    required: false
    default: "uv run pytest"
  checks:
    description: >-
      Which deterministic checks this job ran and how they ended, as
      "name=outcome" pairs separated by commas or newlines; outcome is
      pass | fail | skipped. Example: "lint=success,types=failure" — GitHub's
      own step outcomes are accepted and mapped. Reported so the reviewer stops
      paying model prices for defects a linter already proved absent (#875).
      Absent ⇒ the report names no checks, which grants nothing.
    required: false
    default: ""
  ran-commands:
    description: >-
      Which commands this job ALREADY executed, one "<outcome> <command>" per
      line; outcome is pass | fail | skipped (GitHub's own step outcomes are
      accepted). A validation command these prove is not executed a second
      time — the reporter runs in the same job that just ran the suite, and
      re-running it cost as much as the tests themselves (#1081). Unlike
      `checks`, which names outcomes by step name, this names the command
      itself: "lint=success" cannot be matched against a task's
      "uv run ruff check hub tests". Absent ⇒ nothing is reused.
    required: false
    default: ""
  mutations-file:
    description: >-
      Path to the JSON written by scripts/mutation_changed.py (#1270). Sent to
      the hub under its own key, as a warning — never as a check outcome.
      Absent or unreadable ⇒ the key is not sent and the log says why.
    required: false
    default: ""

  baseline-file:
    description: >-
      Path to the JSON written by scripts/red_test_baseline.py (#913): the
      branch's changed tests run over the merge-base code, a status per test.
      Sent to the hub under its own key as evidence for the red-test gate on
      bugs. Absent or unreadable ⇒ the key is not sent and the log says why.
    required: false
    default: ""

  evidence-run:
    description: >-
      Whether the mutations and the red-test baseline were EXPECTED in this run
      (#1606, #1785): "true" | "false" | empty. The caller decides it once from
      the GitHub event. `false` ⇒ they were deliberately not computed and the
      hub is sent no mutations / baseline key, so a report never erases evidence
      stored earlier for the same commit. `true` ⇒ they were expected: a file
      that is missing or broken is sent as an explicit error with its cause,
      never as "no survivors" and never as an absent key. Empty ⇒ the caller does
      not say, and the file alone decides (a missing file sends nothing).
    required: false
    default: ""

  event-action:
    description: >-
      The activity type of the triggering event (opened, synchronize, ...), or
      empty. Recorded with the run id and URL as provenance inside each
      evidence block, so the hub can name the run an evidence came from.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Report to hub
      shell: bash
      env:
        HAIPLANE_HUB_URL: ${{ inputs.hub-url }}
        HAIPLANE_HUB_CI_TOKEN: ${{ inputs.hub-token }}
        HAIPLANE_HUB_CI_READ_TOKEN: ${{ inputs.hub-read-token }}
        HAIPLANE_HUB_CI_RESULTS_DIR: ${{ inputs.results-dir }}
        HEAD_SHA: ${{ inputs.head-sha }}
        HAIPLANE_HUB_CI_PYTEST: ${{ inputs.ac-runner }}
        HAIPLANE_HUB_CI_CHECKS: ${{ inputs.checks }}
        HAIPLANE_HUB_CI_RAN: ${{ inputs.ran-commands }}
        HAIPLANE_HUB_CI_MUTATIONS: ${{ inputs.mutations-file }}
        HAIPLANE_HUB_CI_BASELINE: ${{ inputs.baseline-file }}
        HAIPLANE_HUB_CI_EVIDENCE_RUN: ${{ inputs.evidence-run }}
        HAIPLANE_HUB_CI_EVENT_ACTION: ${{ inputs.event-action }}
      run: |
        set -u
        # A repo-hosted action ships with its whole repository, so the reporter
        # sits three levels up from this action directory. The fallback covers
        # the hub's own workflow, which uses the action by local path.
        script="${GITHUB_ACTION_PATH}/../../../scripts/ci_report_to_hub.py"
        if [ ! -f "$script" ]; then
          script="scripts/ci_report_to_hub.py"
        fi
        if [ ! -f "$script" ]; then
          echo "[hub-report] reporter not found — reporting nothing; the hub reads this as unknown"
          exit 0
        fi
        python3 "$script"
