name: CI

on:
  # #475: no base-branch allowlist. The delivery gate (#605/#606) merges a PR
  # only after reading THIS workflow's outcome, so a base the allowlist did not
  # name produced no run, the probe answered "absent", and approved work could
  # not be delivered by any supported path. The base is a project setting the
  # hub resolves from project.default_branch — a repository that renames its
  # integration branch, or a satellite that reuses this file with master, must
  # not have to remember to edit a list here for its gate to keep working.
  # Stacked PRs (task → task) now run CI too, which is the correct answer for
  # the same reason: the gate reads their outcome as well.
  pull_request:
  # Push stays explicit: it is what triggers the deploy job below, and deploying
  # is a decision about which branches are production, not about where CI runs.
  push:
    branches:
      - main
      - develop
  # #1196: прогон рождается только по событию, а на уже запушенном коммите
  # события больше не будет. Наблюдено на #1185 06.09.2026: коммит 9ac59bb
  # не породил ни одного прогона, close+reopen PR тоже — оставался лишь пуш
  # нового коммита, который сдвигает submission_sha и требует пересдачи с
  # новым платным прогоном ревью. Ручной триггер даёт прогон на СУЩЕСТВУЮЩЕМ
  # коммите: dispatch идёт по ref, прогон ложится на вершину этой ветки.
  # Дёргает его человек или гейт доставки (#1197) — и покупает этим ПРОВЕРКИ,
  # а не выкат: деплой ниже стоит на push в main и ручным запуском недостижим.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# #1923: a new push to a pull request makes the run of the previous push of THAT
# pull request pointless, and it holds runners (the executors of k8 run several
# tasks at once). Only a `synchronize` run joins a group and only a `synchronize`
# run cancels: its group is the pull request, and it can only meet the runs of
# older pushes of the same pull request.
# Every other run (push to develop/main, a manual dispatch, opened, reopened) gets
# a group of its own, named by its run id, so it is never cancelled and never
# replaces a waiting run: the delivery gate reads EVERY run on a sha, and one
# cancelled run on it is `failed` for good (hub/integrations/forge/github.py),
# so a dispatch of the executor, the run of a merge or a deploy must not be a
# victim. The deploy job keeps its own group below.
# Known limit: a head that goes A -> B -> A by force-push leaves a cancelled run on A.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

jobs:
  # #1767: the dedup decision lives in a job of its own so that the parts of
  # the suite can wait for it and `test` can read it. Same code as before: the
  # step is moved, not rewritten.
  treedup:
    name: Detect tree already tested
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.treedup.outputs.skip }}
      # #1785: whether the evidence (mutations, red-test baseline) is expected
      # in THIS run. Decided once, here, and read by job `evidence` (to run) and
      # by job `test` (to know what a missing file means).
      evidence_run: ${{ steps.evidence.outputs.run }}
      # #1919: whether job `evidence` takes the evidence of the dispatch run on
      # this same head instead of counting it again, and from which run.
      # #1921: "true" only when the files are there, i.e. the decision AND the
      # upload of the adopted evidence succeeded; anything else is a recount.
      adopt: ${{ steps.adopt.outputs.adopt == 'true' && steps.adopt_upload.outcome == 'success' && 'true' || 'false' }}
      adopted_run_id: ${{ steps.adopt.outputs.adopted_run_id }}

    steps:
      # #1606: мутации (~9,5 мин) и baseline (~2-3 мин) считаются там, где их
      # результат будет прочитан, а не на каждом обновлении ветки. Решение
      # принимается по СОБЫТИЮ GitHub, которое CI знает сам, без доверия к
      # хабу: ручной прогон исполнителя ДО сдачи (workflow_dispatch) и первый
      # прогон PR (opened/reopened) task-ветки. Обновление ветки (synchronize —
      # гейт подтянул базу или автор дописал коммит) и не-task PR (релизный
      # develop→main, возврат main→develop, dependabot/*) их не считают;
      # Test, AC и validation идут как раньше. Ветка и база — через env, а не
      # подстановкой в тело: имя ветки приходит снаружи.
      # #1785: the step moved here from job `test` (same case, same answers). It
      # is the FIRST step and needs nothing from the checkout, so no failure of
      # a later step can leave the output empty.
      - name: Decide whether mutations and baseline are worth their minutes
        id: evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$EVENT_NAME:$EVENT_ACTION:$HEAD_REF" in
            workflow_dispatch:*:task-* | pull_request:opened:task-* | pull_request:reopened:task-*)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "mutations/baseline: running ($EVENT_NAME ${EVENT_ACTION:-manual} on $HEAD_REF)"
              ;;
            push:*)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "mutations/baseline: skipped (push: the branch is the base, the diff is empty)"
              ;;
            pull_request:synchronize:task-*)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "mutations/baseline: skipped (synchronize: a branch update; they come from the manual run before submission or from opened)"
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "mutations/baseline: skipped ($EVENT_NAME ${EVENT_ACTION:-manual} on $HEAD_REF: not a task branch run they are for)"
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # #1919: the executor dispatches CI before submitting and the hub opens the
      # PR at submission: both runs sit on the same head sha, and the mutations
      # and the red-test baseline (~10 min) were counted twice. Only the opened
      # and reopened runs of a task branch look for a source; the script
      # (standard library, no install) answers adopt=true only when the dispatch
      # run's evidence was measured against the base of THIS merge commit
      # (HEAD^1, not the event's base.sha, which may lag) and the merge tree equals
      # the head tree. Any doubt or failure is adopt=false: a recount, never a
      # red job. The token is the read-only one of this workflow (actions: read).
      - name: Adopt the evidence of the dispatch run on the same head
        id: adopt
        if: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened') && startsWith(github.head_ref, 'task-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 -I scripts/adopt_evidence.py decide \
            --head-sha "$HEAD_SHA" --base-ref "$BASE_REF" \
            --github-output "$GITHUB_OUTPUT" --out-dir adopted-evidence

      # #1921: the adopted files become the artifact of THIS run right here, so
      # the legs of the mutation matrix and the baseline have nothing to compute
      # and job test downloads the same name it always did. The name has no attempt
      # number and `overwrite` is set for the reason given at the upload in job
      # `evidence`. Failure of this step makes the output `adopt` false: a recount.
      - name: Keep the adopted evidence as the artifact of this run
        id: adopt_upload
        if: ${{ steps.adopt.outputs.adopt == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-ci-evidence
          overwrite: true
          path: |
            adopted-evidence/mutation-report.json
            adopted-evidence/red-test-baseline.json
          if-no-files-found: error
          retention-days: 3

      # #1077: замерено на релизе 30.08.2026 — один и тот же прогон матрицы
      # выполнился 5 раз подряд (PR → develop → релизный PR → main →
      # обратный мерж), из них информацию несли только 2: остальные три
      # гоняли pytest над байт-в-байт тем же деревом файлов под новым SHA —
      # мерж- и squash-коммиты меняют SHA, но не содержимое. Маркер "дерево
      # уже зелёное" — это сам успешный прогон над этим деревом, отдельной
      # публикации хэша нет: ищем совпадение git tree-hash среди последних
      # успешных прогонов ЭТОГО workflow. Равенство хэша дерева и есть
      # равенство содержимого, так что источник-прогон доверен по
      # построению — подделать чужой зелёный прогон с нашим деревом нельзя,
      # не имея наш контент. git fetch по sha отдельным шагом нужен потому,
      # что голова squash-нутого PR недостижима из develop локальным
      # git rev-parse без явной подкачки. Только push: на pull_request этот
      # шаг не выполняется вовсе — PR-прогоны несут AC-evidence для гейта
      # доставки хаба (#546/#605), и их нельзя пропускать. continue-on-error:
      # любой сбой здесь (сеть, gh api, отсутствие кандидатов) должен всегда
      # означать полный прогон, а не покрасить джоб.
      - name: Detect tree already tested (skip pytest on exact dedup)
        id: treedup
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse HEAD^{tree})
          echo "Current tree: $tree"

          gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&per_page=50" \
            --jq '.workflow_runs[] | "\(.head_sha) \(.html_url)"' | \
          while read -r sha html_url; do
            candidate_tree=$(git rev-parse "$sha^{tree}" 2>/dev/null) || true
            if [ -z "$candidate_tree" ]; then
              git fetch -q --no-tags origin "$sha" 2>/dev/null || true
              candidate_tree=$(git rev-parse "$sha^{tree}" 2>/dev/null) || true
            fi
            if [ -z "$candidate_tree" ]; then
              # Кандидат недостижим даже после fetch — пропускаем молча.
              continue
            fi
            if [ "$candidate_tree" = "$tree" ]; then
              echo "tree already green — pytest skipped: tree $tree, source run $html_url"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done

          if [ "$(cat "$GITHUB_OUTPUT" 2>/dev/null | grep -c '^skip=true$')" = "0" ]; then
            echo "tree not seen before — running pytest: $tree"
          fi

  # #1767: the full suite as parallel parts. Measured (#1700, 39 attempts):
  # the Test step took 8.4 min of a 16.4 min run; the runner has 4 cores, the
  # time is spread evenly, so speeding up single tests gains little, while the
  # repository is public and parallel jobs cost nothing.
  #
  # This job runs the code of the branch, so it holds no environment, no secret
  # and no report key (#1686). It reports nothing: the artifact, the AC
  # collection and the report to the hub stay in job `test`.
  #
  # The split is a plugin loaded by this command only (-p scripts.pytest_shard),
  # never a hook in tests/conftest.py: a collection hook in a conftest turns the
  # AC locators under tests/ into "unknown". Every step carries the dedup
  # condition, so a skipped suite installs nothing; the job still ends
  # "success", which is what job `test` reads together with the dedup output.
  pytest:
    name: Tests part ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: treedup
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # #1785: the number of parts is set HERE and nowhere else; the job name
        # and the command read it from strategy.job-total.
        shard: [1, 2, 3, 4]
    # Same as in job test: a missing tool or root is a red test, not a skip.
    env:
      CI_REQUIRE_ROOT_TESTS: "1"

    steps:
      - name: Checkout
        if: ${{ needs.treedup.outputs.skip != 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The same uv version as everywhere (#1620), asserted by
      # tests/test_ci_workflow_contract.py.
      - name: Install uv
        if: ${{ needs.treedup.outputs.skip != 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        if: ${{ needs.treedup.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # #1707: see the same step in job test; no `|| true`.
      - name: Install age and openssh-server (backup tests)
        if: ${{ needs.treedup.outputs.skip != 'true' }}
        run: |
          if ! sudo apt-get install -y --no-install-recommends age openssh-server; then
            echo "::warning::apt-get install failed on the package lists of the image; updating them and trying once more"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends age openssh-server
          fi
          command -v age && command -v age-keygen && test -x /usr/sbin/sshd
          sudo -n true

      - name: Install dependencies
        if: ${{ needs.treedup.outputs.skip != 'true' }}
        run: uv sync --locked --dev

      # -n auto распараллеливает прогон по ядрам раннера. Не в addopts: тот же
      # флаг достался бы шагу "Report AC tests", а его парсер ждёт nodeid
      # первым токеном строки `-v` — xdist ставит там `[gw0]`, и каждый AC
      # ушёл бы в not_found. Прогон AC остаётся последовательным.
      # Имя шага "Test" осталось прежним: по нему сборщик времени называет
      # минуты тестов (scripts/ci_trusted_report.py, TIMING_STEPS), и части
      # складываются в один ключ.
      - name: Test
        id: shard
        if: ${{ needs.treedup.outputs.skip != 'true' }}
        # #1666: a hung test must not hold the run for the 360 min default;
        # pytest-timeout (300 s per test) names the test well before this.
        timeout-minutes: 25
        run: HAIPLANE_TEST_SHARD=${{ matrix.shard }}/${{ strategy.job-total }} uv run pytest -p scripts.pytest_shard -q -n auto --durations=30

  # #1921: the mutations run as a matrix of legs. The series was sequential under
  # one 540 s budget that was nearly always spent (570-690 s on the critical path
  # of every dispatch and first PR run). Each leg takes the mutants whose rank in
  # one global order is its number mod N (scripts/mutation_changed.py --shard), so
  # the legs are a partition, and the series budget of a leg is 540/N seconds
  # (at least 60): the same total work, 1/N of the wall time. N is the matrix.
  #
  # `continue-on-error` at the JOB level: a red leg must not make the workflow red
  # (ci_trust requires run_conclusion=success), and job `evidence` says in the
  # merged report what a failed leg cost.
  #
  # The legs hold no environment, no secret and no report key (#1686): they run
  # the branch's code. Their reports travel as intermediate artifacts whose names
  # do not start with `hub-ci-results-`; job `evidence` below puts them together.
  # The step keeps its name: the hub names the minutes of a step by that name and
  # adds them up over every job (ci_trusted_report.TIMING_STEPS, ci_timing).
  # A run that adopted the dispatch run's evidence (job treedup) skips the legs.
  mutation_legs:
    name: Mutations leg ${{ matrix.leg }}/${{ strategy.job-total }}
    needs: treedup
    if: ${{ needs.treedup.outputs.evidence_run == 'true' && needs.treedup.outputs.adopt != 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The number of legs is set HERE and nowhere else.
        leg: [1, 2, 3]
    # Same as in job test: a missing tool or root is a red test, not a skip.
    env:
      CI_REQUIRE_ROOT_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The mutations diff against the base branch, and merge-base needs
          # history that a depth-1 checkout does not have.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # #1707: see the same step in job test; no `|| true`.
      - name: Install age and openssh-server (backup tests)
        run: |
          if ! sudo apt-get install -y --no-install-recommends age openssh-server; then
            echo "::warning::apt-get install failed on the package lists of the image; updating them and trying once more"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends age openssh-server
          fi
          command -v age && command -v age-keygen && test -x /usr/sbin/sshd
          sudo -n true

      - name: Install dependencies
        run: uv sync --locked --dev

      # #1270: spike #1263 — 37 of 234 confirmed findings in 30 days were "this
      # test does not fail on broken behaviour", and the reviewer named the
      # surviving mutation himself in 33. The script mutates ONLY the Python
      # functions this PR changed, runs the tests that reference their files,
      # and names every survivor. It observes a green baseline by rc first: a
      # red one is reported as "the series did not run", never as "no
      # survivors". Warning only, like Surface parity: the script exits 0,
      # continue-on-error keeps a crash out of the delivery gate, and the
      # timeout caps the cost.
      # The base is the PR base, develop for a manual run (as for the baseline).
      # #1921: the baseline has a ceiling of its own (540 s, as before); the
      # series budget is the leg's share of 540 s, never below 60 s.
      - name: Mutations of changed functions (warning only)
        id: mutations
        continue-on-error: true
        timeout-minutes: 15
        env:
          LEG: ${{ matrix.leg }}
          LEGS: ${{ strategy.job-total }}
        run: |
          budget=$((540 / LEGS))
          if [ "$budget" -lt 60 ]; then budget=60; fi
          uv run python scripts/mutation_changed.py \
            --base "origin/${{ github.base_ref || 'develop' }}" \
            --shard "$LEG/$LEGS" \
            --baseline-timeout 540 \
            --budget-seconds "$budget" \
            --json-out mutation-report.json

      # The name carries the leg, not an attempt number: "Re-run failed jobs"
      # reruns only the failed legs, and the others must still be found. A rerun
      # replaces the file (`overwrite`).
      - name: Hand the mutation report of this leg over
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-ci-mutations-leg-${{ matrix.leg }}
          overwrite: true
          path: mutation-report.json
          if-no-files-found: ignore
          retention-days: 1

  # #913: the red-test gate for bugs needs proof that the AC test failed BEFORE
  # the fix, and the hub accepts CI reports only about the pinned commit. So the
  # proof travels in that same report: the branch's changed tests/** are laid
  # over the merge-base code in a separate worktree and run with junitxml —
  # failed (assert) / passed / error (collection, ImportError, fixture). A test
  # failing on the base is DATA, not an error: the script always exits 0 and
  # continue-on-error keeps a crash out of the delivery gate. task-* branches
  # only (PR and manual runs); the base is the PR base, develop for a manual run.
  # #1921: a job of its own, beside the legs (it used to follow the whole series).
  baseline:
    name: Red-test baseline
    needs: treedup
    if: ${{ needs.treedup.outputs.evidence_run == 'true' && needs.treedup.outputs.adopt != 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_REQUIRE_ROOT_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # #1707: see the same step in job test; no `|| true`.
      - name: Install age and openssh-server (backup tests)
        run: |
          if ! sudo apt-get install -y --no-install-recommends age openssh-server; then
            echo "::warning::apt-get install failed on the package lists of the image; updating them and trying once more"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends age openssh-server
          fi
          command -v age && command -v age-keygen && test -x /usr/sbin/sshd
          sudo -n true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Red-test baseline on merge-base (data only)
        id: baseline
        continue-on-error: true
        timeout-minutes: 10
        run: |
          uv run python scripts/red_test_baseline.py \
            --base "origin/${{ github.base_ref || 'develop' }}" \
            --json-out red-test-baseline.json

      - name: Hand the baseline report over
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-ci-baseline
          overwrite: true
          path: red-test-baseline.json
          if-no-files-found: ignore
          retention-days: 1

  # The one place that puts the evidence of this run together, under the job name
  # and the artifact name the rest of the pipeline (and a later PR run that adopts
  # this one, #1919) knows. Standard library only: nothing is installed.
  # `!cancelled()`: legs that failed or were skipped must still produce a report
  # that SAYS so (state=error with the reason), never silence. A run that adopted
  # the evidence (treedup) has nothing to put together and skips this job.
  # The name has NO attempt number, so a rerun finds and replaces the files
  # (`overwrite: true`) and job test of attempt 2 finds those of attempt 1 (same
  # run, same commit).
  # A lost leg is put back by "Re-run failed jobs" (#1921, measured 20.10.2026 on
  # a throwaway workflow with this very graph shape: run 39430519486): a job with
  # a job-level `continue-on-error` that fails has conclusion `failure` in the
  # API while the RUN stays `success`, so the rerun takes the leg and everything
  # that `needs` it, i.e. this job and then job test. This job downloads the legs
  # of the run (the new one and the ones of attempt 1), so the merge is complete,
  # and job test sends a second report. The property lives in the `needs` of the
  # three jobs; tests/test_ci_workflow_contract.py holds it.
  evidence:
    name: Mutations and red-test baseline
    needs: [treedup, mutation_legs, baseline]
    if: ${{ !cancelled() && needs.treedup.outputs.evidence_run == 'true' && needs.treedup.outputs.adopt != 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the mutation reports of the legs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hub-ci-mutations-leg-*
          path: legs

      - name: Download the baseline report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hub-ci-baseline
          path: .

      - name: Put the legs together
        run: |
          mkdir -p legs
          python3 -I scripts/merge_mutation_legs.py \
            --legs-dir legs --out mutation-report.json

      # The hand-over to job test: whatever files exist. No files at all ⇒ no
      # artifact (ignore), and job test reports the missing file as an error with
      # its cause.
      - name: Upload the evidence files for job test
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-ci-evidence
          overwrite: true
          path: |
            mutation-report.json
            red-test-baseline.json
          if-no-files-found: ignore
          # #1919: a PR run opened after a dispatch run adopts these files; one
          # day was shorter than the gap between a dispatch and a late PR.
          retention-days: 3

  # #1920: the static checks do not depend on the tests, yet they used to run in
  # job `test` AFTER the parts and the evidence (~80-100 s on every critical
  # path: ruff, mypy, bandit, the budgets, the secret scan at ~44 s, the audit).
  # They run here, beside the parts. Same steps, same names, same ids, same
  # conditions; only the place changed. Job `test` stays the one required check
  # and the one collector: it waits for this job and is red when this job is not
  # green (the step `Static checks outcome`). The job holds no environment, no
  # secret and no report key (#1686): it runs the branch's code.
  # The age/openssh install of job `test` is not here: only the backup tests need
  # it, and this job runs none.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The outcomes the collector of job `test` reports as `checks` (lint, format,
    # types) and as `ran-commands`; the names are the contract of
    # ci_contract.CHECK_VOCABULARY and must not grow here.
    outputs:
      lint: ${{ steps.lint.outcome }}
      format: ${{ steps.format.outcome }}
      types: ${{ steps.types.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # #833: the surface parity check diffs against the base branch, and
          # merge-base needs history that a depth-1 checkout does not have.
          fetch-depth: 0

      # #1620: the same uv version as everywhere, asserted by
      # tests/test_ci_workflow_contract.py.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # #1620: --locked: the committed uv.lock is what is checked, a stale lock fails.
        run: uv sync --locked --dev

      # #875: these steps get ids so their outcomes can be REPORTED to the
      # hub. The reviewer was paying model prices to rediscover defects ruff
      # and mypy had proven absent minutes earlier, because the result stopped
      # here. `continue-on-error` is deliberately NOT set: a red job must stay
      # red — the point is to tell the reviewer what passed, not to soften the
      # gate.
      - name: Lint
        id: lint
        run: uv run ruff check hub tests

      # #1066: до этой проверки в линте не было ни одного правила сложности, и
      # `ruff check` был зелёным всё время, пока submit_for_review рос до 173
      # операторов. Ledger сегодняшних 36 исключений — в
      # docs/agent-context/complexity-budget.json; тридцать седьмое нарушение
      # красит этот шаг. Печатается всегда, а не только при провале: разбивка
      # по причинам (task / permanent / unclaimed) видна в зелёном прогоне,
      # иначе долг без задачи тихо перестаёт считаться долгом.
      - name: Complexity budget
        id: complexity
        run: uv run python scripts/complexity_budget.py

      # #1669: размер .py-файла ничем не ограничен, а крупный дифф deep-ревью
      # не дочитывает. Пороги по деревьям — в pyproject.toml, ledger — в
      # docs/agent-context/file-size-budget.json. Печатается всегда.
      - name: File size budget
        id: file_size
        if: ${{ !cancelled() }}
        run: uv run python scripts/file_size_budget.py

      # #1852: направления импорта между слоями hub. Таблица слоёв, запреты и
      # ledger сегодняшних исключений — в docs/agent-context/layer-rules.json;
      # новое запрещённое ребро красит этот шаг. Печатается всегда.
      - name: Layer rules
        id: layers
        if: ${{ !cancelled() }}
        run: uv run python scripts/layer_rules.py

      # #1854: влитый файл hub/migrations/steps/ не правится и не удаляется,
      # посторонние записи в каталоге красят CI (старт их терпит). База сверки -
      # состояние ДО события: на push HEAD уже содержит правку, и сверка с самой
      # веткой молчала бы (push: github.event.before, PR: база PR).
      - name: Migration steps add-only
        id: migration_steps
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          uv run python scripts/migration_steps_add_only.py \
            --github-event "$EVENT_NAME" --before "$EVENT_BEFORE" --base-ref "$BASE_REF"

      - name: Check formatting
        id: format
        run: uv run ruff format --check hub tests

      - name: Type check
        id: types
        run: uv run mypy hub

      # #780: the tool catalog is a tax every agent pays on every turn, and it
      # grew to its current size because nothing was watching. The check
      # measures the real tools/list — not the source — against the budget
      # committed in docs/agent-context/mcp-catalog-budget.json, and a breach
      # prints which tools moved. Raising the budget is an edit to that file
      # in a reviewed change; that is the entire mechanism.
      # Печатается всегда, а не только при провале: остаток запаса под потолком
      # (#829) виден в логе зелёного прогона — запас, за которым никто не
      # следит, это способ тихо перестать проверять.
      - name: MCP catalog budget
        run: uv run python scripts/mcp_catalog_budget.py

      # #1989: a test that compares the real clock with a threshold under one
      # second fails on a loaded machine without a defect in the code (#1984).
      # The AST check fails on a NEW such assert; the old places live in
      # docs/agent-context/wallclock-asserts.json with an owner. The step has no
      # `if`, `continue-on-error` or `|| true`: its exit code is the gate.
      - name: Wall-clock asserts
        run: uv run python scripts/wallclock_asserts.py

      # #833: consistency is the densest family of confirmed review findings —
      # a contract changed in one place and left stale in the other two. The
      # check lays this diff over a map of surfaces that travel together and
      # names the ones it left behind, so the author sees the hole a cycle
      # before the reviewer does. Warning only: the script always exits 0, and
      # continue-on-error keeps an unexpected crash out of the delivery gate,
      # which reads this job's outcome (#546/#605).
      # Pull requests only: on a push to develop the branch IS the base, so
      # the diff is empty and the line says nothing.
      - name: Surface parity (warning only)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          uv run python scripts/surface_parity.py \
            --base "origin/${{ github.base_ref }}"

      # #611: the audit no longer decides whether anything ships. The delivery
      # gate (#605/#606) reads THIS job, so a new advisory used to stop delivery
      # for the whole repository without a single commit — and an advisory may
      # have no fixed version at all, which made that freeze open-ended. It
      # still runs, still prints, and its findings become hub drafts: a step that
      # can never fail is a step nobody reads, so the record has to land
      # somewhere with an owner.
      # #1686: the drafts are filed by ci-report.yml from this file (push to
      # develop or main only), with a key of their own; this job sends nothing.
      - name: Dependency vulnerability audit
        continue-on-error: true
        run: |
          mkdir -p hub-ci-static
          uv run pip-audit --progress-spinner off -f json -o hub-ci-static/audit.json


      # #1920: the audit file reaches job `test` through an artifact whose name
      # does NOT start with `hub-ci-results-`: the trusted report reads only that
      # prefix (scripts/ci_trusted_report.py), and the file gets there through job
      # `test`, which puts it into the directory it uploads under that name.
      - name: Hand the audit file over to job test
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-ci-static
          overwrite: true
          path: hub-ci-static/audit.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Static security scan
        run: uv run bandit -r hub -q

      # #1080: тело проверки живёт в scripts/secret_scan.py, потому что его
      # зовёт и `make security` — определение одно, разъехаться нечему.
      - name: Secret scan
        run: uv run python scripts/secret_scan.py

  test:
    name: Ruff and pytest
    # #1767: the one required check, the one place that collects the AC and
    # sends the artifact. It runs after the dedup decision, the parts and the
    # evidence whatever their outcome, and judges the parts in the step `tests`
    # below. #1785: it waits for job `evidence` only to download its files; the
    # outcome of that job is read nowhere (it is continue-on-error and a
    # missing file is reported as an error by the collector).
    needs: [treedup, pytest, evidence, static]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # #1666: 90 min = explicit step ceilings plus headroom for the steps that
    # have no ceiling of their own (install, lint, type check, scans). #1767:
    # the 25 min of the Test step moved to job `pytest`; #1785: the mutations
    # (15 min) and the baseline (10 min) moved to job `evidence`. The ceiling of
    # THIS job stays as it was.
    timeout-minutes: 90
    # #1707: the backup tests install a real user and an sshd drop-in on this
    # disposable runner. With this variable a missing tool or missing root is a
    # red test, not a skip (tests/backup_support.py::must_have). Job level on
    # purpose: the AC collector below runs the same tests and must not see a skip.
    env:
      CI_REQUIRE_ROOT_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # #833: the surface parity check diffs against the base branch, and
          # merge-base needs history that a depth-1 checkout does not have.
          fetch-depth: 0

      # #1620: ONE uv version in CI test, CI deploy and the Dockerfile. uv >= 0.10
      # prunes wheels of platforms the lock does not target, and uv 0.7 lowers the
      # lock revision, so a floating version would rewrite uv.lock under us. The
      # same string is asserted equal everywhere by tests/test_ci_workflow_contract.py.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # #1707: tests/test_backup_install.py and tests/test_snapshot_serve.py run
      # the real install.sh and a real sshd, and tests/test_hub_snapshot.py
      # encrypts with real age. No continue-on-error and no `|| true`: if a tool
      # is missing this step is red, the tests are never skipped.
      # #1923: install FIRST, on the package lists of the image; only when that
      # fails (a list gone stale, a 404) the lists are updated and the install is
      # tried once more. A second failure is the failure of the step; the tool
      # checks below stay the last word. The same lines are in every job.
      - name: Install age and openssh-server (backup tests)
        run: |
          if ! sudo apt-get install -y --no-install-recommends age openssh-server; then
            echo "::warning::apt-get install failed on the package lists of the image; updating them and trying once more"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends age openssh-server
          fi
          command -v age && command -v age-keygen && test -x /usr/sbin/sshd
          sudo -n true

      - name: Install dependencies
        # #1620: --locked: the committed uv.lock is what is tested, a stale lock fails.
        run: uv sync --locked --dev

      # #1767: the suite itself runs in job `pytest` (the parts in parallel).
      # THIS step is the only place that turns the results of the parts into one
      # outcome, and `steps.tests.outcome` below keeps meaning "the suite
      # passed". It reads `needs.pytest.result`, which GitHub folds from EVERY
      # matrix leg (failure if one failed, cancelled if one was cancelled), not
      # an output of the matrix, which carries the value of one leg at random.
      # It is skipped ONLY when the tree was already green (job treedup) AND the
      # parts finished without a failure; in every other case it runs and is
      # red unless the parts succeeded. `always()` is explicit: without a status
      # function GitHub adds `success()`, and a red earlier step (Lint, install)
      # would turn this step into "skipped" instead of red. The job `if` is
      # `always()` WITHOUT `!cancelled()`: a cancelled run must still run this
      # job and end red, not be skipped (a skipped required check can count as
      # passed).
      - name: Tests outcome of the parts
        id: tests
        if: ${{ always() && !(needs.treedup.outputs.skip == 'true' && needs.pytest.result == 'success') }}
        env:
          PARTS_RESULT: ${{ needs.pytest.result }}
        run: |
          if [ "$PARTS_RESULT" = "success" ]; then
            echo "the test parts passed"
            exit 0
          fi
          echo "::error::the test parts did not pass: result is '${PARTS_RESULT:-unknown}'"
          exit 1

      # #1920: the static checks run in job `static`. This job is the ONE required
      # check, so a red `static` must make it red: without this step a failed
      # lint would leave "Ruff and pytest" green and a manual merge would pass.
      # `always()` for the same reason as the step above (a cancelled or skipped
      # `static` is not a pass), and the steps after it (Download, Collect, Upload,
      # Fail a cancelled run) carry their own status functions, so a red static
      # does not stop the report from being collected.
      - name: Static checks outcome
        id: static
        if: ${{ always() }}
        env:
          STATIC_RESULT: ${{ needs.static.result }}
        run: |
          if [ "$STATIC_RESULT" = "success" ]; then
            echo "the static checks passed"
            exit 0
          fi
          echo "::error::the static checks did not pass: result is '${STATIC_RESULT:-unknown}'"
          exit 1

      # #546: the hub has no test runner by design, so the evidence for its two
      # SDD gates is produced here and reported back. Placed AFTER the main test
      # step and marked continue-on-error on purpose: the delivery gate
      # (#605/#606) decides whether a PR may merge by reading this job's
      # outcome, so a collecting hiccup must never turn into a merge block for
      # every task. Without the secrets the script collects nothing and says so —
      # the hub reads silence as unknown, never as success.
      # #761: the same composite action satellite repositories use, so there is
      # one collector with one behaviour instead of this step and a copy of it
      # that drifts. The commit passed below must be the BRANCH HEAD: on
      # pull_request events GITHUB_SHA is a throwaway merge of head into base,
      # which exists in no branch and can never equal the tip the hub pinned at
      # submission (#572).
      # #1686: THIS JOB RUNS THE BRANCH'S CODE (tests, conftest.py, the action
      # and the scripts themselves). It therefore holds no key that makes the
      # hub believe a report: the only hub secret here is a read-only key for
      # the task card. The collector runs the AC tests and the validation
      # commands without any HAIPLANE_HUB_* variable and writes the results to
      # hub-ci-results/, uploaded below as an artifact. The report itself is
      # sent by .github/workflows/ci-report.yml, which GitHub runs from the
      # default branch after this workflow completes.
      # #1785: the evidence files of job `evidence`. `!cancelled()`, not the
      # implicit success(): a red Lint or Tests step must not skip the download,
      # the proof is about the base and the mutations, not about this job.
      # A missing artifact (job evidence failed to prepare, nothing written) is a
      # failed download here — it does not stop the job, and the collector turns
      # the missing file into an explicit error because evidence-run is true.
      - name: Download the evidence files of job evidence
        if: ${{ !cancelled() && needs.treedup.outputs.evidence_run == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hub-ci-evidence
          path: .

      - name: Collect AC test and validation results for the Hub
        if: ${{ always() }}
        continue-on-error: true
        # #1666: the collector has its own overall deadline (17 min, see
        # _REPORT_DEADLINE in scripts/ci_report_to_hub.py): past it no command
        # is launched, the rest is recorded as not run, and the results are
        # written before this 20 min ceiling can cut the step.
        timeout-minutes: 20
        uses: ./.github/actions/hub-ci-report
        with:
          hub-url: ${{ secrets.HAIPLANE_HUB_URL }}
          hub-read-token: ${{ secrets.HAIPLANE_HUB_CI_READ_TOKEN }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ac-runner: uv run pytest
          # #1270: its own key in the hub's report, not a `checks` entry.
          mutations-file: mutation-report.json
          # #913: its own key too — evidence for the red-test gate on bugs.
          baseline-file: red-test-baseline.json
          # #1606/#1785: whether the evidence was EXPECTED in this run (decided
          # in job treedup), so the reporter can tell "not expected" (no key
          # sent) from "expected and no file" (an explicit error).
          evidence-run: ${{ needs.treedup.outputs.evidence_run }}
          event-action: ${{ github.event.action }}
          # A step that never ran reports its outcome as '' and is dropped by
          # the reporter — silence, not a pass (#875).
          checks: >-
            lint=${{ needs.static.outputs.lint }},
            format=${{ needs.static.outputs.format }},
            types=${{ needs.static.outputs.types }},
            tests=${{ steps.tests.outcome }}
          # #1081: the same outcomes keyed by the COMMAND, not the step name, so
          # a validation command this job already ran is not run a second time.
          # Measured before this: the reporter step equalled the Test step
          # (236-333s) purely because task cards declare the suite here. These
          # strings must stay byte-identical to the run: lines above — a drifted
          # copy silently stops matching and the duplicate run comes back.
          ran-commands: |
            ${{ needs.static.outputs.lint }} uv run ruff check hub tests
            ${{ needs.static.outputs.format }} uv run ruff format --check hub tests
            ${{ needs.static.outputs.types }} uv run mypy hub
            ${{ steps.tests.outcome }} uv run pytest -q -n auto --durations=30

      # #1920: the audit file of job `static`, put where ci-report.yml reads it.
      # After the collector, which writes results.json into the same directory.
      # Not cancelled-proof on purpose: a missing file is a missing file (the
      # reporter files no drafts), never a red job (the audit never blocked).
      - name: Fetch the audit file of job static
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hub-ci-static
          path: hub-ci-results

      # #1686: the hand-over to ci-report.yml. The name carries the attempt of
      # THIS run, so a re-run is never confused with the first attempt. The
      # directory holds data only; the reporter reads it as such.
      - name: Upload results for the trusted report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hub-ci-results-${{ github.run_attempt }}
          path: hub-ci-results/
          if-no-files-found: ignore
          retention-days: 7

      # #1767: job test runs on `always()` so that it exists on a cancelled run,
      # but the steps with an implicit success() (Lint, Types, the scans) are
      # skipped then, and the tests step may already have passed. This LAST step
      # turns any cancellation, at whatever point it came, into a red job.
      # Status functions are allowed only in `if`, not in `env`.
      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: |
          echo "::error::the run was cancelled before every check finished"
          exit 1

  # #1358: холодный старт из docker-compose.yml (#944, #1336) не проверял ни
  # один шаг — ни сборку образа, ни /healthz, ни старт без демо-сида. Ревью
  # PR haiplane#442 потеряло ровно эти три измерения: у облачного ревьюера нет
  # Docker, а на раннере он есть. Job идёт параллельно test и в needs деплоя
  # не стоит: прод живёт не в этом образе, и путь выката он не удлиняет.
  compose-smoke:
    name: Compose cold start
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # На PR — только когда дифф задевает то, из чего собирается образ.
      # Push и ручной запуск гоняют всегда: там нет базы для сравнения, а
      # прогон стоит пару минут.
      - name: Decide whether the image is touched
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "event $EVENT: smoke runs unconditionally"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if echo "$changed" | grep -qE '^(Dockerfile|docker-compose\.yml|\.dockerignore|pyproject\.toml|uv\.lock|hub/|scripts/|deploy/docker/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "image inputs changed: smoke runs"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no image inputs in the diff: smoke skipped"
          fi

      - name: Compose cold start smoke
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: deploy/docker/compose_smoke.sh

  # #1996: browser scenarios of the task card (tests/gui, Playwright, a real hub
  # in CSRF-require mode). Serverside tests (TestClient) do not see JS, HTMX,
  # autorefresh or how a browser submits a form; two button defects reached
  # production that way on 2026-10-22.
  #
  # Optional until ten green runs in a row, and that is a decision of the owner,
  # not of this file: `continue-on-error` at the JOB level keeps a red scenario
  # from turning the workflow red (the delivery gate reads the workflow
  # conclusion, ci_trust requires success). The job holds no secret and no
  # report key: it runs the code of the branch. It needs nothing and nothing
  # needs it, so it adds no minutes to the critical path of the suite.
  # tests/gui is excluded from every other run (addopts --ignore in
  # pyproject.toml), so no other job installs Chromium or sees these nodes.
  gui:
    name: GUI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      HAIPLANE_GUI_ARTIFACTS: gui-artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --dev

      # The browsers are keyed by OS and by the lock, which pins the Playwright
      # version. The install below still runs on a hit: it is the one that puts
      # the system libraries of the image in place, and it is quick when the
      # browser is already there.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: GUI scenarios
        run: make gui-test

      - name: Upload the failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gui-failure-evidence
          path: gui-artifacts
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: test
    # Only deploy real merges into main, never on pull_request runs.
    # #1796: a condition without a status function gets an implicit success(),
    # and success() is false when ANY transitive ancestor was skipped. On push
    # the evidence job is skipped (evidence_run=false), so the old condition
    # skipped every deploy. !cancelled() replaces the implicit success() and
    # needs.test.result == 'success' keeps a red or skipped test from shipping.
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    environment: production
    # #1588: деплой ждёт идущие локальные deep-ревью до 1800 с (deploy/review-drain.sh),
    # потом rsync, pip, restart и health. Без своего предела job жил бы до 6 часов
    # GitHub по умолчанию; 45 мин = срок ожидания + запас на выкладку.
    timeout-minutes: 45
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # #1620: prod installs exactly what uv.lock pins. The sets are exported
      # here, from the commit being deployed, into the tree that the next step
      # rsyncs to staging; remote-deploy.sh checks both files before it changes
      # anything and installs them wheels-only with --require-hashes. uv is the
      # same pinned version as in the test job and the Dockerfile; Python 3.11 is
      # the version of prod. --no-emit-project: the app is installed by the
      # server itself, with --no-deps. Without --no-dev the dev group would ship.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.18"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export hashed dependency sets from uv.lock
        run: |
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --no-header -o requirements.runtime.txt
          uv export --frozen --only-group build --no-emit-project --format requirements-txt --no-header -o requirements.build.txt
          echo "runtime: $(grep -cE '^[A-Za-z0-9][A-Za-z0-9._-]*==' requirements.runtime.txt) packages, build: $(grep -cE '^[A-Za-z0-9][A-Za-z0-9._-]*==' requirements.build.txt) packages"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync working tree to staging
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          # #1590: the commit goes into the file name of the pre-deploy backup.
          # .git is not in staging and the CI key's forced command takes no
          # arguments or environment, so the sha travels as a file of the tree.
          printf '%s\n' "$DEPLOYED_SHA" > .deploy-sha
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes" \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '*.pyc' \
            --exclude '.git' \
            ./ \
            "$DEPLOY_USER@$DEPLOY_HOST:~/haiplane-hub-src-staging/"

      - name: Deploy and health check
        id: rollout
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Keepalive: на время ожидания (до 1800 с) в канале бывает тихо, и
          # промежуточный узел не должен счесть соединение мёртвым (#1588).
          # #1590: the output is captured locally AND shown, the ssh exit code
          # is kept, and the `backup:` line goes to the step output EVEN when
          # the code is non-zero - a deploy that refused to restart because the
          # backup failed is exactly the one whose verdict the hub must get.
          # The original code is returned at the end.
          log="${RUNNER_TEMP:-/tmp}/rollout.log"
          set +e
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < deploy/remote-deploy.sh 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          line="$(grep '^backup: ' "$log" | tail -n 1 | tr -d '\r' || true)"
          if [ -n "$line" ]; then
            printf 'backup=%s\n' "${line#backup: }" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      # #496: tell the Hub what is now running. Until this step existed the
      # Hub knew only when it MERGED something and read that as delivery — on
      # 21.08.2026 a task sat completed while this very job was skipped,
      # because deployment runs from main and the merge went to develop.
      #
      # always(): a rollout that FAILED is a fact too. Reporting successes
      # only would show the Hub a pipeline that never breaks.
      #
      # continue-on-error: a red job here would say the deploy did not happen,
      # when it did — the reporting failed, not the rollout. Silence is not the
      # alternative: the failure is printed, and the Hub reads a missing record
      # as "unknown" rather than as "not deployed" (#839).
      - name: Report deploy to Hub
        if: always()
        continue-on-error: true
        env:
          HAIPLANE_HUB_URL: ${{ secrets.HAIPLANE_HUB_URL }}
          HAIPLANE_HUB_CI_TOKEN: ${{ secrets.HAIPLANE_HUB_CI_TOKEN }}
          ROLLOUT_OUTCOME: ${{ steps.rollout.outcome }}
          DEPLOYED_SHA: ${{ github.sha }}
          DEPLOYED_REF: ${{ github.ref_name }}
          # Project slug for the release row (#1453); unset or empty -> default.
          DEPLOYED_PROJECT: ${{ vars.HAIPLANE_HUB_PROJECT || 'default' }}
          # #1590: verdict of the pre-deploy backup; empty = the log had none.
          BACKUP_LINE: ${{ steps.rollout.outputs.backup }}
        run: |
          if [ -z "$HAIPLANE_HUB_URL" ] || [ -z "$HAIPLANE_HUB_CI_TOKEN" ]; then
            echo "::notice::Hub secrets absent — deploy not reported (fork or clone)"
            exit 0
          fi
          if [ "$ROLLOUT_OUTCOME" = "success" ]; then
            STATUS=success
          else
            STATUS=failed
          fi
          # The body is built by a serializer, not by string interpolation: the
          # backup reason may carry quotes, and a broken body would lose the report.
          body_file="$(mktemp)"
          STATUS="$STATUS" python3 -c '
          import json, os
          body = {
              "sha": os.environ["DEPLOYED_SHA"],
              "ref": os.environ["DEPLOYED_REF"],
              "status": os.environ["STATUS"],
              "project": os.environ["DEPLOYED_PROJECT"],
          }
          if os.environ.get("BACKUP_LINE"):
              body["backup"] = os.environ["BACKUP_LINE"][:500]
          print(json.dumps(body))
          ' > "$body_file"
          code=$(curl -sS -o /tmp/deploy-callback.out -w '%{http_code}' \
            -X POST "$HAIPLANE_HUB_URL/api/deploys" \
            -H "Authorization: Bearer $HAIPLANE_HUB_CI_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @"$body_file" \
          ) || code=000
          if [ "$code" != "200" ]; then
            echo "::warning::Hub did not record the deploy (HTTP $code): $(cat /tmp/deploy-callback.out)"
            exit 0
          fi
          echo "Deploy reported to Hub: $DEPLOYED_SHA ($STATUS)"
