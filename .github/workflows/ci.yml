name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Ruff and pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check hub tests

      - name: Check formatting
        run: uv run ruff format --check hub tests

      - name: Test
        run: uv run pytest -q

      - name: Dependency vulnerability audit
        run: uv run pip-audit --progress-spinner off

      - name: Static security scan
        run: uv run bandit -r hub -q

      - name: Secret scan
        run: |
          uv run detect-secrets scan \
            --exclude-files '(^uv\.lock$|^\.pytest_cache/|^\.ruff_cache/)' \
            > /tmp/detect-secrets.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/detect-secrets.json").read_text())
          results = report.get("results", {})
          if results:
              print(json.dumps(results, indent=2))
              raise SystemExit(1)
          print("No secrets detected")
          PY

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: test
    # Only deploy real merges into main, never on pull_request runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync working tree to staging
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes" \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '*.pyc' \
            --exclude '.git' \
            ./ \
            "$DEPLOY_USER@$DEPLOY_HOST:~/openclaw-hub-src-staging/"

      - name: Deploy and health check
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < deploy/remote-deploy.sh
