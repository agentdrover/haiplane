name: CI

on:
  # #475: no base-branch allowlist. The delivery gate (#605/#606) merges a PR
  # only after reading THIS workflow's outcome, so a base the allowlist did not
  # name produced no run, the probe answered "absent", and approved work could
  # not be delivered by any supported path. The base is a project setting the
  # hub resolves from project.default_branch — a repository that renames its
  # integration branch, or a satellite that reuses this file with master, must
  # not have to remember to edit a list here for its gate to keep working.
  # Stacked PRs (task → task) now run CI too, which is the correct answer for
  # the same reason: the gate reads their outcome as well.
  pull_request:
  # Push stays explicit: it is what triggers the deploy job below, and deploying
  # is a decision about which branches are production, not about where CI runs.
  push:
    branches:
      - main
      - develop
  # #1196: прогон рождается только по событию, а на уже запушенном коммите
  # события больше не будет. Наблюдено на #1185 06.09.2026: коммит 9ac59bb
  # не породил ни одного прогона, close+reopen PR тоже — оставался лишь пуш
  # нового коммита, который сдвигает submission_sha и требует пересдачи с
  # новым платным прогоном ревью. Ручной триггер даёт прогон на СУЩЕСТВУЮЩЕМ
  # коммите: dispatch идёт по ref, прогон ложится на вершину этой ветки.
  # Дёргает его человек или гейт доставки (#1197) — и покупает этим ПРОВЕРКИ,
  # а не выкат: деплой ниже стоит на push в main и ручным запуском недостижим.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Ruff and pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # #833: the surface parity check diffs against the base branch, and
          # merge-base needs history that a depth-1 checkout does not have.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      # #1077: замерено на релизе 30.08.2026 — один и тот же прогон матрицы
      # выполнился 5 раз подряд (PR → develop → релизный PR → main →
      # обратный мерж), из них информацию несли только 2: остальные три
      # гоняли pytest над байт-в-байт тем же деревом файлов под новым SHA —
      # мерж- и squash-коммиты меняют SHA, но не содержимое. Маркер "дерево
      # уже зелёное" — это сам успешный прогон над этим деревом, отдельной
      # публикации хэша нет: ищем совпадение git tree-hash среди последних
      # успешных прогонов ЭТОГО workflow. Равенство хэша дерева и есть
      # равенство содержимого, так что источник-прогон доверен по
      # построению — подделать чужой зелёный прогон с нашим деревом нельзя,
      # не имея наш контент. git fetch по sha отдельным шагом нужен потому,
      # что голова squash-нутого PR недостижима из develop локальным
      # git rev-parse без явной подкачки. Только push: на pull_request этот
      # шаг не выполняется вовсе — PR-прогоны несут AC-evidence для гейта
      # доставки хаба (#546/#605), и их нельзя пропускать. continue-on-error:
      # любой сбой здесь (сеть, gh api, отсутствие кандидатов) должен всегда
      # означать полный прогон, а не покрасить джоб.
      - name: Detect tree already tested (skip pytest on exact dedup)
        id: treedup
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse HEAD^{tree})
          echo "Current tree: $tree"

          gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&per_page=50" \
            --jq '.workflow_runs[] | "\(.head_sha) \(.html_url)"' | \
          while read -r sha html_url; do
            candidate_tree=$(git rev-parse "$sha^{tree}" 2>/dev/null) || true
            if [ -z "$candidate_tree" ]; then
              git fetch -q --no-tags origin "$sha" 2>/dev/null || true
              candidate_tree=$(git rev-parse "$sha^{tree}" 2>/dev/null) || true
            fi
            if [ -z "$candidate_tree" ]; then
              # Кандидат недостижим даже после fetch — пропускаем молча.
              continue
            fi
            if [ "$candidate_tree" = "$tree" ]; then
              echo "tree already green — pytest skipped: tree $tree, source run $html_url"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done

          if [ "$(cat "$GITHUB_OUTPUT" 2>/dev/null | grep -c '^skip=true$')" = "0" ]; then
            echo "tree not seen before — running pytest: $tree"
          fi

      # #875: these steps get ids so their outcomes can be REPORTED to the
      # hub. The reviewer was paying model prices to rediscover defects ruff
      # and mypy had proven absent minutes earlier, because the result stopped
      # here. `continue-on-error` is deliberately NOT set: a red job must stay
      # red — the point is to tell the reviewer what passed, not to soften the
      # gate.
      - name: Lint
        id: lint
        run: uv run ruff check hub tests

      # #1066: до этой проверки в линте не было ни одного правила сложности, и
      # `ruff check` был зелёным всё время, пока submit_for_review рос до 173
      # операторов. Ledger сегодняшних 36 исключений — в
      # docs/agent-context/complexity-budget.json; тридцать седьмое нарушение
      # красит этот шаг. Печатается всегда, а не только при провале: разбивка
      # по причинам (task / permanent / unclaimed) видна в зелёном прогоне,
      # иначе долг без задачи тихо перестаёт считаться долгом.
      - name: Complexity budget
        id: complexity
        run: uv run python scripts/complexity_budget.py

      - name: Check formatting
        id: format
        run: uv run ruff format --check hub tests

      - name: Type check
        id: types
        run: uv run mypy hub

      # -n auto распараллеливает прогон по ядрам раннера. Не в addopts: тот же
      # флаг достался бы шагу "Report AC tests" ниже, а его парсер ждёт nodeid
      # первым токеном строки `-v` — xdist ставит там `[gw0]`, и каждый AC
      # ушёл бы в not_found. Прогон AC остаётся последовательным.
      - name: Test
        id: tests
        if: ${{ steps.treedup.outputs.skip != 'true' }}
        run: uv run pytest -q -n auto

      # #780: the tool catalog is a tax every agent pays on every turn, and it
      # grew to its current size because nothing was watching. The check
      # measures the real tools/list — not the source — against the budget
      # committed in docs/agent-context/mcp-catalog-budget.json, and a breach
      # prints which tools moved. Raising the budget is an edit to that file
      # in a reviewed change; that is the entire mechanism.
      # Печатается всегда, а не только при провале: остаток запаса под потолком
      # (#829) виден в логе зелёного прогона — запас, за которым никто не
      # следит, это способ тихо перестать проверять.
      - name: MCP catalog budget
        run: uv run python scripts/mcp_catalog_budget.py

      # #833: consistency is the densest family of confirmed review findings —
      # a contract changed in one place and left stale in the other two. The
      # check lays this diff over a map of surfaces that travel together and
      # names the ones it left behind, so the author sees the hole a cycle
      # before the reviewer does. Warning only: the script always exits 0, and
      # continue-on-error keeps an unexpected crash out of the delivery gate,
      # which reads this job's outcome (#546/#605).
      # Pull requests only: on a push to develop the branch IS the base, so
      # the diff is empty and the line says nothing.
      - name: Surface parity (warning only)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          uv run python scripts/surface_parity.py \
            --base "origin/${{ github.base_ref }}"

      # #1606: мутации (~9,5 мин) и baseline (~2-3 мин) считаются там, где их
      # результат будет прочитан, а не на каждом обновлении ветки. Решение
      # принимается по СОБЫТИЮ GitHub, которое CI знает сам, без доверия к
      # хабу: ручной прогон исполнителя ДО сдачи (workflow_dispatch) и первый
      # прогон PR (opened/reopened) task-ветки. Обновление ветки (synchronize —
      # гейт подтянул базу или автор дописал коммит) и не-task PR (релизный
      # develop→main, возврат main→develop, dependabot/*) их не считают;
      # Test, AC и validation идут как раньше. Ветка и база — через env, а не
      # подстановкой в тело: имя ветки приходит снаружи.
      - name: Decide whether mutations and baseline are worth their minutes
        id: evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$EVENT_NAME:$EVENT_ACTION:$HEAD_REF" in
            workflow_dispatch:*:task-* | pull_request:opened:task-* | pull_request:reopened:task-*)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "mutations/baseline: running ($EVENT_NAME ${EVENT_ACTION:-manual} on $HEAD_REF)"
              ;;
            push:*)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "mutations/baseline: skipped (push: the branch is the base, the diff is empty)"
              ;;
            pull_request:synchronize:task-*)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "mutations/baseline: skipped (synchronize: a branch update; they come from the manual run before submission or from opened)"
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "mutations/baseline: skipped ($EVENT_NAME ${EVENT_ACTION:-manual} on $HEAD_REF: not a task branch run they are for)"
              ;;
          esac

      # #1270: spike #1263 — 37 of 234 confirmed findings in 30 days were "this
      # test does not fail on broken behaviour", and the reviewer named the
      # surviving mutation himself in 33. The script mutates ONLY the Python
      # functions this PR changed, runs the tests that reference their files,
      # and names every survivor. It observes a green baseline by rc first: a
      # red one is reported as "the series did not run", never as "no
      # survivors". Warning only, like Surface parity: the script exits 0,
      # continue-on-error keeps a crash out of the delivery gate, and the
      # timeout caps the cost (outcome revisit condition: 10 minutes).
      # #1606: runs only where the "evidence" step above says so; the base is the
      # PR base, develop for a manual run (as for the baseline below).
      - name: Mutations of changed functions (warning only)
        id: mutations
        if: ${{ steps.evidence.outputs.run == 'true' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          uv run python scripts/mutation_changed.py \
            --base "origin/${{ github.base_ref || 'develop' }}" \
            --budget-seconds 540 \
            --json-out mutation-report.json

      # #913: the red-test gate for bugs needs proof that the AC test failed
      # BEFORE the fix, and the hub accepts CI reports only about the pinned
      # commit. So the proof travels in that same report: the branch's changed
      # tests/** are laid over the merge-base code in a separate worktree and
      # run with junitxml — failed (assert) / passed / error (collection,
      # ImportError, fixture). A test failing on the base is DATA, not an
      # error: the script always exits 0 and continue-on-error keeps a crash
      # out of the delivery gate. task-* branches only (PR and manual runs);
      # the base is the PR base, develop for a manual run.
      - name: Red-test baseline on merge-base (data only)
        id: baseline
        # !cancelled(): the proof is about the base, not about this commit's
        # own Test step — a red suite must not also erase the baseline.
        # #1606: the same decision as for the mutations (task-* is part of it).
        if: ${{ !cancelled() && steps.evidence.outputs.run == 'true' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          uv run python scripts/red_test_baseline.py \
            --base "origin/${{ github.base_ref || 'develop' }}" \
            --json-out red-test-baseline.json

      # #546: the hub has no test runner by design, so the evidence for its two
      # SDD gates is produced here and reported back. Placed AFTER the main test
      # step and marked continue-on-error on purpose: the delivery gate
      # (#605/#606) decides whether a PR may merge by reading this job's
      # outcome, so a reporting hiccup must never turn into a merge block for
      # every task. Without the secrets the script reports nothing and says so —
      # the hub reads silence as unknown, never as success.
      # #761: the same composite action satellite repositories use, so there is
      # one reporter with one behaviour instead of this step and a copy of it
      # that drifts. The commit passed below must be the BRANCH HEAD: on
      # pull_request events GITHUB_SHA is a throwaway merge of head into base,
      # which exists in no branch and can never equal the tip the hub pinned at
      # submission (#572).
      - name: Report AC tests and validation to Hub
        if: ${{ always() }}
        continue-on-error: true
        uses: ./.github/actions/hub-ci-report
        with:
          hub-url: ${{ secrets.HAIPLANE_HUB_URL }}
          hub-token: ${{ secrets.HAIPLANE_HUB_CI_TOKEN }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          ac-runner: uv run pytest
          # #1270: its own key in the hub's report, not a `checks` entry.
          mutations-file: mutation-report.json
          # #913: its own key too — evidence for the red-test gate on bugs.
          baseline-file: red-test-baseline.json
          # #1606: what each step DID, so the reporter can tell "did not run"
          # (no key sent) from "ran and left no file" (an explicit error).
          mutations-outcome: ${{ steps.mutations.outcome }}
          baseline-outcome: ${{ steps.baseline.outcome }}
          event-action: ${{ github.event.action }}
          # A step that never ran reports its outcome as '' and is dropped by
          # the reporter — silence, not a pass (#875).
          checks: >-
            lint=${{ steps.lint.outcome }},
            format=${{ steps.format.outcome }},
            types=${{ steps.types.outcome }},
            tests=${{ steps.tests.outcome }}
          # #1081: the same outcomes keyed by the COMMAND, not the step name, so
          # a validation command this job already ran is not run a second time.
          # Measured before this: the reporter step equalled the Test step
          # (236-333s) purely because task cards declare the suite here. These
          # strings must stay byte-identical to the run: lines above — a drifted
          # copy silently stops matching and the duplicate run comes back.
          ran-commands: |
            ${{ steps.lint.outcome }} uv run ruff check hub tests
            ${{ steps.format.outcome }} uv run ruff format --check hub tests
            ${{ steps.types.outcome }} uv run mypy hub
            ${{ steps.tests.outcome }} uv run pytest -q -n auto

      # #611: the audit no longer decides whether anything ships. The delivery
      # gate (#605/#606) reads THIS job, so a new advisory used to stop delivery
      # for the whole repository without a single commit — and an advisory may
      # have no fixed version at all, which made that freeze open-ended. It
      # still runs, still prints, and its findings become hub drafts in the next
      # step: a step that can never fail is a step nobody reads, so the record
      # has to land somewhere with an owner.
      - name: Dependency vulnerability audit
        continue-on-error: true
        run: uv run pip-audit --progress-spinner off -f json -o audit.json

      - name: File audit findings as Hub drafts
        if: ${{ always() }}
        continue-on-error: true
        env:
          HAIPLANE_HUB_URL: ${{ secrets.HAIPLANE_HUB_URL }}
          HAIPLANE_HUB_CI_TOKEN: ${{ secrets.HAIPLANE_HUB_CI_TOKEN }}
          AUDIT_JSON: audit.json
        run: uv run python scripts/ci_report_audit_to_hub.py

      - name: Static security scan
        run: uv run bandit -r hub -q

      # #1080: тело проверки живёт в scripts/secret_scan.py, потому что его
      # зовёт и `make security` — определение одно, разъехаться нечему.
      - name: Secret scan
        run: uv run python scripts/secret_scan.py

  # #1358: холодный старт из docker-compose.yml (#944, #1336) не проверял ни
  # один шаг — ни сборку образа, ни /healthz, ни старт без демо-сида. Ревью
  # PR haiplane#442 потеряло ровно эти три измерения: у облачного ревьюера нет
  # Docker, а на раннере он есть. Job идёт параллельно test и в needs деплоя
  # не стоит: прод живёт не в этом образе, и путь выката он не удлиняет.
  compose-smoke:
    name: Compose cold start
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # На PR — только когда дифф задевает то, из чего собирается образ.
      # Push и ручной запуск гоняют всегда: там нет базы для сравнения, а
      # прогон стоит пару минут.
      - name: Decide whether the image is touched
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "event $EVENT: smoke runs unconditionally"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if echo "$changed" | grep -qE '^(Dockerfile|docker-compose\.yml|\.dockerignore|pyproject\.toml|uv\.lock|hub/|scripts/|deploy/docker/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "image inputs changed: smoke runs"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no image inputs in the diff: smoke skipped"
          fi

      - name: Compose cold start smoke
        if: ${{ steps.scope.outputs.run == 'true' }}
        run: deploy/docker/compose_smoke.sh

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: test
    # Only deploy real merges into main, never on pull_request runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    # #1588: деплой ждёт идущие локальные deep-ревью до 1800 с (deploy/review-drain.sh),
    # потом rsync, pip, restart и health. Без своего предела job жил бы до 6 часов
    # GitHub по умолчанию; 45 мин = срок ожидания + запас на выкладку.
    timeout-minutes: 45
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync working tree to staging
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          # #1590: the commit goes into the file name of the pre-deploy backup.
          # .git is not in staging and the CI key's forced command takes no
          # arguments or environment, so the sha travels as a file of the tree.
          printf '%s\n' "$DEPLOYED_SHA" > .deploy-sha
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes" \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '*.pyc' \
            --exclude '.git' \
            ./ \
            "$DEPLOY_USER@$DEPLOY_HOST:~/haiplane-hub-src-staging/"

      - name: Deploy and health check
        id: rollout
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Keepalive: на время ожидания (до 1800 с) в канале бывает тихо, и
          # промежуточный узел не должен счесть соединение мёртвым (#1588).
          # #1590: the output is captured locally AND shown, the ssh exit code
          # is kept, and the `backup:` line goes to the step output EVEN when
          # the code is non-zero - a deploy that refused to restart because the
          # backup failed is exactly the one whose verdict the hub must get.
          # The original code is returned at the end.
          log="${RUNNER_TEMP:-/tmp}/rollout.log"
          set +e
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < deploy/remote-deploy.sh 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          line="$(grep '^backup: ' "$log" | tail -n 1 | tr -d '\r' || true)"
          if [ -n "$line" ]; then
            printf 'backup=%s\n' "${line#backup: }" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      # #496: tell the Hub what is now running. Until this step existed the
      # Hub knew only when it MERGED something and read that as delivery — on
      # 21.08.2026 a task sat completed while this very job was skipped,
      # because deployment runs from main and the merge went to develop.
      #
      # always(): a rollout that FAILED is a fact too. Reporting successes
      # only would show the Hub a pipeline that never breaks.
      #
      # continue-on-error: a red job here would say the deploy did not happen,
      # when it did — the reporting failed, not the rollout. Silence is not the
      # alternative: the failure is printed, and the Hub reads a missing record
      # as "unknown" rather than as "not deployed" (#839).
      - name: Report deploy to Hub
        if: always()
        continue-on-error: true
        env:
          HAIPLANE_HUB_URL: ${{ secrets.HAIPLANE_HUB_URL }}
          HAIPLANE_HUB_CI_TOKEN: ${{ secrets.HAIPLANE_HUB_CI_TOKEN }}
          ROLLOUT_OUTCOME: ${{ steps.rollout.outcome }}
          DEPLOYED_SHA: ${{ github.sha }}
          DEPLOYED_REF: ${{ github.ref_name }}
          # Project slug for the release row (#1453); unset or empty -> default.
          DEPLOYED_PROJECT: ${{ vars.HAIPLANE_HUB_PROJECT || 'default' }}
          # #1590: verdict of the pre-deploy backup; empty = the log had none.
          BACKUP_LINE: ${{ steps.rollout.outputs.backup }}
        run: |
          if [ -z "$HAIPLANE_HUB_URL" ] || [ -z "$HAIPLANE_HUB_CI_TOKEN" ]; then
            echo "::notice::Hub secrets absent — deploy not reported (fork or clone)"
            exit 0
          fi
          if [ "$ROLLOUT_OUTCOME" = "success" ]; then
            STATUS=success
          else
            STATUS=failed
          fi
          # The body is built by a serializer, not by string interpolation: the
          # backup reason may carry quotes, and a broken body would lose the report.
          body_file="$(mktemp)"
          STATUS="$STATUS" python3 -c '
          import json, os
          body = {
              "sha": os.environ["DEPLOYED_SHA"],
              "ref": os.environ["DEPLOYED_REF"],
              "status": os.environ["STATUS"],
              "project": os.environ["DEPLOYED_PROJECT"],
          }
          if os.environ.get("BACKUP_LINE"):
              body["backup"] = os.environ["BACKUP_LINE"][:500]
          print(json.dumps(body))
          ' > "$body_file"
          code=$(curl -sS -o /tmp/deploy-callback.out -w '%{http_code}' \
            -X POST "$HAIPLANE_HUB_URL/api/deploys" \
            -H "Authorization: Bearer $HAIPLANE_HUB_CI_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @"$body_file" \
          ) || code=000
          if [ "$code" != "200" ]; then
            echo "::warning::Hub did not record the deploy (HTTP $code): $(cat /tmp/deploy-callback.out)"
            exit 0
          fi
          echo "Deploy reported to Hub: $DEPLOYED_SHA ($STATUS)"
