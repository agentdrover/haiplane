name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Ruff and pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check hub tests

      - name: Check formatting
        run: uv run ruff format --check hub tests

      - name: Test
        run: uv run pytest -q

      - name: Dependency vulnerability audit
        run: uv run pip-audit --progress-spinner off

      - name: Static security scan
        run: uv run bandit -r hub -q

      - name: Secret scan
        run: |
          uv run detect-secrets scan \
            --exclude-files '(^uv\.lock$|^\.pytest_cache/|^\.ruff_cache/)' \
            > /tmp/detect-secrets.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/detect-secrets.json").read_text())
          results = report.get("results", {})
          if results:
              print(json.dumps(results, indent=2))
              raise SystemExit(1)
          print("No secrets detected")
          PY
